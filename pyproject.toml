[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentlens"
version = "0.1.0"
description = "A small columnar query engine with conservative segment pruning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy==2.3.3"]

[project.scripts]
segmentlens = "segmentlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
